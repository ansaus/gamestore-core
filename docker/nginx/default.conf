# Апстримы резолвятся на каждый запрос через встроенный DNS Docker.
# Иначе nginx запоминает IP контейнера при старте, и любой `docker compose
# restart app` кладёт стек в 502 до перезапуска самого nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

# Main store API -> php-fpm container "app"
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# Supplier stub -> php-fpm container "supplier-stub" (separate container = honest network timeouts)
server {
    listen 90;
    server_name _;
    root /var/www/html/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream_stub supplier-stub:9000;
        fastcgi_pass $upstream_stub;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        # stub is allowed to "hang" far longer than the client's 2s timeout
        fastcgi_read_timeout 120s;
        include fastcgi_params;
    }
}
